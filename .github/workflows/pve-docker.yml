name: Build and validate PVE Docker images

on:
  workflow_dispatch:
    inputs:
      version:
        description: PVE version to build and publish
        type: choice
        default: all
        options: ['all', '7', '8', '9']
      architecture:
        description: amd64 uses official PVE; arm64 uses community PXVIRT (8/9 only)
        type: choice
        default: all
        options: ['all', 'amd64', 'arm64']
  schedule:
    - cron: '15 4 * * 1'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-validate-publish:
    permissions:
      contents: write
    if: github.repository == 'oneclickvirt/pve' && github.ref == 'refs/heads/main' && inputs.architecture != 'arm64'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(inputs.version == '7' && '["7"]' || inputs.version == '8' && '["8"]' || inputs.version == '9' && '["9"]' || '["7","8","9"]') }}
    concurrency:
      group: pve-docker-${{ github.ref }}-${{ matrix.major }}
      cancel-in-progress: false
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require hardware acceleration for the disposable verification VM
        run: test -c /dev/kvm

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build, validate inside a disposable VM and publish Docker Hub and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: 'true'
          PUBLISH_DOCKERHUB: 'true'
        run: bash dockerfiles/build-modern.sh '${{ matrix.major }}'

  build-arm64:
    if: github.repository == 'oneclickvirt/pve' && github.ref == 'refs/heads/main' && inputs.architecture != 'amd64' && inputs.version != '7'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(inputs.version == '8' && '["8"]' || inputs.version == '9' && '["9"]' || '["8","9"]') }}
    steps:
      - name: Checkout source without publication credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build native ARM64 candidate without publication
        env:
          PVE_CANDIDATE_DIR: ${{ runner.temp }}/pve-candidate
        run: bash dockerfiles/build-modern.sh '${{ matrix.major }}' arm64

      - name: Transfer candidate to the independent verification VM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pve-arm64-${{ matrix.major }}-candidate
          path: ${{ runner.temp }}/pve-candidate/
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  validate-arm64:
    needs: build-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(inputs.version == '8' && '["8"]' || inputs.version == '9' && '["9"]' || '["8","9"]') }}
    steps:
      - name: Checkout source without publication credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download this workflow run's ARM64 candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pve-arm64-${{ matrix.major }}-candidate
          path: ${{ runner.temp }}/pve-candidate

      - name: Validate PVE in this independent disposable ARM VM
        run: python3 -u dockerfiles/arm64-candidate.py validate "$RUNNER_TEMP/pve-candidate" '${{ matrix.major }}' "$RUNNER_TEMP/pve-validation/validation.json"

      - name: Transfer successful validation bound to this candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pve-arm64-${{ matrix.major }}-validation
          path: ${{ runner.temp }}/pve-validation/validation.json
          if-no-files-found: error
          retention-days: 1

  publish-arm64:
    needs: [build-arm64, validate-arm64]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(inputs.version == '8' && '["8"]' || inputs.version == '9' && '["9"]' || '["8","9"]') }}
    concurrency:
      group: pve-docker-${{ github.ref }}-${{ matrix.major }}
      cancel-in-progress: false
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download this workflow run's validated candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pve-arm64-${{ matrix.major }}-candidate
          path: ${{ runner.temp }}/pve-candidate

      - name: Download this workflow run's successful validation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pve-arm64-${{ matrix.major }}-validation
          path: ${{ runner.temp }}/pve-validation

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify candidate and runtime report before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u dockerfiles/arm64-candidate.py publish "$RUNNER_TEMP/pve-candidate" '${{ matrix.major }}' "$RUNNER_TEMP/pve-validation/validation.json"
