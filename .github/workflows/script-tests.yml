name: Script Tests

on:
  push:
    paths:
      - '**/*.sh'
      - '**/*.service'
      - '**/*.py'
      - '.github/workflows/script-tests.yml'
  pull_request:
    paths:
      - '**/*.sh'
      - '**/*.service'
      - '**/*.py'
      - '.github/workflows/script-tests.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Validate shell syntax
        run: |
          set -euo pipefail
          bash tests/script_static_test.sh
          bash tests/download_required_file_test.sh

      - name: Run PVE network regression tests
        run: |
          set -euo pipefail
          for test_script in tests/*test.sh; do
            case "$test_script" in *live*|*/script_static_test.sh) continue;; esac
            bash "$test_script"
          done
          for test_script in tests/*test.py; do
            python3 "$test_script"
          done

      - name: ShellCheck regression test
        run: shellcheck -e SC2034,SC2329 tests/*.sh
