name: Script Tests

on:
  push:
    paths:
      - '**/*.sh'
      - '**/*.service'
      - '.github/workflows/script-tests.yml'
  pull_request:
    paths:
      - '**/*.sh'
      - '**/*.service'
      - '.github/workflows/script-tests.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Validate shell syntax
        run: |
          set -euo pipefail
          bash tests/script_static_test.sh

      - name: Run PVE network regression tests
        run: |
          bash tests/install_pve_network_test.sh
          bash tests/build_nat_network_test.sh
          bash tests/ifupdown2_install_test.sh
          bash tests/default_vm_config_test.sh
          bash tests/pve_delete_ipv6_test.sh
          bash tests/ssh_sh_portability_test.sh
          bash tests/configure_network_test.sh

      - name: ShellCheck regression test
        run: shellcheck -e SC2034,SC2329 tests/*.sh
